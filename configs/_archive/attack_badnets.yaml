seed: 42
data:
  dataset_path: "./data"
  batch_size: 64
model:
  name: "small_cnn"
federated:
  num_clients: 20
  clients_per_round: 10
  local_epochs: 2
  rounds_dev: 20
  rounds_main: 100
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  device_preference: "mps" # Will fall back to cpu if unavailable
attack:
  malicious_client_id: 0
  poison_ratio: 0.10
  target_class: 0
  trigger_size: 3
  attack_start_round: 30
  scale_factor: 1.0
paths:
  results_dir: "./results"
