seed: 42
data:
  dataset_path: "./data"
  batch_size: 64
model:
  name: "small_cnn"
training:
  epochs: 10
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  device_preference: "mps" # Will fall back to cpu if unavailable
paths:
  checkpoint_dir: "./checkpoints"
  results_dir: "./results"
  log_dir: "./logs"
